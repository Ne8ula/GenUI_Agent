[package]
name = "eva-w4-stage-broker"
version = "0.1.0"
edition = "2021"
description = "EVA Week 4 stage broker: consent, scope, write-ahead journal and conditional restoration for scoped desktop staging (platform-neutral; mocked OS adapter only)."
publish = false

[lib]
path = "src/lib.rs"

[features]
# Exposes the synthetic FakeAdapter. Off by default so production builds
# cannot link it; the integration tests enable it via the dev-dependency below.
fake = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Self dev-dependency: turns on `fake` only for test/bench/example builds, so
# `cargo test` needs no extra flags.
eva-w4-stage-broker = { path = ".", features = ["fake"] }
